[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miguellib"
dynamic = ["version"]
description = "Machine Learning project template"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["machine-learning", "template", "data-science"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21,<3",
    "pandas>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "black>=23.0,<25",
    "pytest>=7.0,<9",
    "pytest-cov>=4.0,<6",
    "ipykernel>=6.0,<7",
    "jupyter>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/miguelgfierro/project_template"
Repository = "https://github.com/miguelgfierro/project_template"
Issues = "https://github.com/miguelgfierro/project_template/issues"

[tool.setuptools.dynamic]
version = {attr = "miguellib.__version__"}

[tool.setuptools.packages.find]
where = ["."]
exclude = ["docs*", "examples*", "tests*"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
